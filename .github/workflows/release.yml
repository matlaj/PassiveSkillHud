name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      namespace: ${{ steps.thunderstore.outputs.namespace }}
      community: ${{ steps.thunderstore.outputs.community }}
      categories: ${{ steps.thunderstore.outputs.categories }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check the tag and changelog match the version
        run: python .github/scripts/check_release.py

      - name: Read where to publish on Thunderstore
        id: thunderstore
        run: python .github/scripts/thunderstore_target.py

      - name: Build and package
        run: dotnet build PassiveSkillHud/PassiveSkillHud.csproj -c Release -p:Package=true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "$GITHUB_REF_NAME" --notes "See [CHANGELOG.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)."

  # A separate job so that a failed upload can be re-run on its own: the GitHub release already exists by then, and
  # Thunderstore never accepts the same version twice, so this publishes the exact zip attached to the release.
  thunderstore:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the package from the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$GITHUB_REF_NAME" --pattern '*.zip' --dir dist

      - name: Publish to Thunderstore
        env:
          THUNDERSTORE_TOKEN: ${{ secrets.THUNDERSTORE_SERVICE_ACCOUNT }}
          NAMESPACE: ${{ needs.release.outputs.namespace }}
          COMMUNITY: ${{ needs.release.outputs.community }}
          CATEGORIES: ${{ needs.release.outputs.categories }}
        run: python3 .github/scripts/publish_thunderstore.py
