<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Deep indigo / navy background -->
    <radialGradient id="voidBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14102c" />
      <stop offset="70%" stop-color="#0a0718" />
      <stop offset="100%" stop-color="#030208" />
    </radialGradient>

    <!-- Hot cyan/electric plasma for the main burst -->
    <linearGradient id="plasmaGrad" x1="0%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#2d1b69" />
      <stop offset="35%" stop-color="#00a3ff" />
      <stop offset="75%" stop-color="#38f6d2" />
      <stop offset="100%" stop-color="#f2ffff" />
    </linearGradient>

    <!-- Amber highlight gradient for the ocular core -->
    <linearGradient id="amberCore" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#fff4b8" />
      <stop offset="40%" stop-color="#ffb834" />
      <stop offset="85%" stop-color="#d44b00" />
      <stop offset="100%" stop-color="#4d0e00" />
    </linearGradient>

    <!-- Edge vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000" stop-opacity="0.75" />
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="256" height="256" fill="url(#voidBg)" />

  <!-- Background energy rays (sharp, faceted angular shapes typical of RoR2) -->
  <polygon points="128,128 40,24 92,16" fill="#1b2559" opacity="0.6" />
  <polygon points="128,128 214,32 236,78" fill="#152b66" opacity="0.5" />
  <polygon points="128,128 240,180 210,224" fill="#23174a" opacity="0.7" />
  <polygon points="128,128 46,218 20,166" fill="#1a1c4e" opacity="0.6" />

  <!-- Diagonal kinetic slash / surge through the center -->
  <polygon points="18,210 138,102 118,92 10,192" fill="#0052a3" opacity="0.5" />
  <polygon points="34,228 218,52 234,64 62,238" fill="url(#plasmaGrad)" opacity="0.3" />

  <!-- Angular particle shards -->
  <polygon points="72,52 84,44 78,60" fill="#38f6d2" opacity="0.8" />
  <polygon points="56,76 66,72 60,86" fill="#00a3ff" opacity="0.7" />
  <polygon points="186,182 196,170 198,190" fill="#ffb834" opacity="0.7" />
  <polygon points="208,160 214,152 216,166" fill="#ff7700" opacity="0.6" />
  <polygon points="170,210 182,206 174,220" fill="#38f6d2" opacity="0.5" />

  <!-- Outer HUD Ring: segmented inspection aperture (Tab/inspect motif) -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#1c1f4a" stroke-width="12" />
  <circle cx="128" cy="128" r="88" fill="none" stroke="#00d5ff" stroke-width="5"
    stroke-dasharray="85 25 140 30" />
  <circle cx="128" cy="128" r="88" fill="none" stroke="#ffffff" stroke-width="2"
    stroke-dasharray="20 160 35 60" opacity="0.8" />

  <!-- Outer diamond tick marks (cardinal HUD reticle) -->
  <polygon points="128,26 133,38 128,42 123,38" fill="#38f6d2" />
  <polygon points="128,230 133,218 128,214 123,218" fill="#38f6d2" />
  <polygon points="26,128 38,133 42,128 38,123" fill="#38f6d2" />
  <polygon points="230,128 218,133 214,128 218,123" fill="#38f6d2" />

  <!-- Central "All-Seeing Eye" / Passive Awareness Motif -->
  <!-- Outer eye contour (chunky, angular silhouette) -->
  <path d="M 46,128 C 76,82 180,82 210,128 C 180,174 76,174 46,128 Z" fill="#0b0820"
    stroke="#003554" stroke-width="5" />

  <!-- Sclera energy fill -->
  <path d="M 54,128 C 82,92 174,92 202,128 C 174,164 82,164 54,128 Z" fill="#081a38" />
  <path d="M 54,128 C 82,92 174,92 202,128 C 160,118 96,118 54,128 Z" fill="#0d3b66" opacity="0.6" />

  <!-- Luminous Iris & Pupil -->
  <circle cx="128" cy="128" r="38" fill="#1b0826" stroke="#ff8800" stroke-width="3" />
  <circle cx="128" cy="128" r="32" fill="url(#amberCore)" />

  <!-- Slit / Core Gem pupil -->
  <polygon points="128,100 137,128 128,156 119,128" fill="#1f0300" />
  <polygon points="128,104 134,128 128,152 125,128" fill="#000000" />

  <!-- High-contrast angular specular highlights -->
  <polygon points="112,112 124,106 120,120" fill="#ffffff" opacity="0.95" />
  <polygon points="140,140 148,136 144,144" fill="#ffeaa7" opacity="0.8" />
  <polygon points="80,126 102,118 94,128" fill="#38f6d2" opacity="0.5" />

  <!-- Ambient floating orbital brackets -->
  <path d="M 98,72 L 86,72 L 74,84" fill="none" stroke="#38f6d2" stroke-width="3" opacity="0.7" />
  <path d="M 158,184 L 170,184 L 182,172" fill="none" stroke="#ffb834" stroke-width="3"
    opacity="0.7" />

  <!-- Signature RoR2 Skill Inset Frame -->
  <rect x="12" y="12" width="232" height="232" fill="none" stroke="#161230" stroke-width="18"
    opacity="0.6" />
  <rect x="21" y="21" width="214" height="214" fill="none" stroke="#332a63" stroke-width="2"
    opacity="0.7" />

  <!-- Dark corner vignette -->
  <rect width="256" height="256" fill="url(#vignette)" pointer-events="none" />
</svg>
